<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Lato:100,300,400" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header>
        <div id="header-information">
            <p id="company">LEVERX</p>
            <h1 id="title">EMPLOYEE SERVICES</h1>
        </div>
       <div id="header-search">
            <div id="input-container">
                <input placeholder="Open search panel"/>
            </div>
       </div>
    </header>
    <main>
        <p>9 employees displayed</p>

        <ul>
            <li class="employee">
                <div>
                    <img src="./images/user.png" alt="user" width="50px" height="50px"/>
                    <span>Andrew Savage</span>
                </div>
                <div>
                    <img src="./images/suitcase.png" alt="suitcase" width="10px" height="10px"/>
                    <span>Web & Mobile</span>
                </div>
            </li>
        </ul>
    </main>
</body>
</html>
