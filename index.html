<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Lato:100,300,400" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    <link rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=business_center" /> 
    <script src="/script.js" defer></script>
    <title>Document</title>
</head>
<body>

    <!-- Header -->
    <header class="main-header"></header>

    <!-- Main Content -->
    <main id="main-content">
        <div id="search-and-filter">

            <!-- Basic and advanced search methods -->
            <div id="search-part">
                <input type="radio" id="search-version-basic" name="search-tabs" checked="checked"/>
                <label for="search-version-basic" class="search-version-label basic">BASIC SEARCH</label>
                <div id="employee-search-container">
                    <form class="employee-search-container-form">
                        <div id="employee-search-input-container">
                            <input id="employee-search-input" placeholder="John Smith" oninput='basicSearch(event)'/>
                        </div>
                        <button class="search-button basic-search-btn">SEARCH</button>
                    </form>
                </div>
                
                <input type="radio" id="search-version-advanced" name="search-tabs" />
                <label for="search-version-advanced" class="search-version-label advanced">ADVANCED SEARCH</label>
                <form action="empty.html" id="search-form">
                    <div class="field-label">
                        <label class="search-label" for="name">Name</label>
                        <input type="text" placeholder="John Smith" name="name" id="name" class="search-field"/>
                    </div>
                    <div class="field-label">
                        <label class="search-label" for="email">Email</label>
                        <input type="email" placeholder="johnsmith@leverx.comc" name="email" id="email" class="search-field"/>
                    </div>
                    <div class="phone-telegram">
                        <div class="field-label">
                            <label class="search-label" for="phone">Phone</label>
                            <input type="text" placeholder="Phone Number" name="phone" id="phone" class="search-field"/>
                        </div>
                        <div class="field-label">
                            <label class="search-label" for="telegram">Telegram</label>
                            <input type="text" placeholder="TelegramId" name="telegram" id="telegram" class="search-field"/>
                        </div>
                    </div>
                    <div class="field-label building-room">
                        <div class="field-label">
                            <label class="search-label" for="building">Building</label>
                            <select id="building" name="building" class="search-field">
                                <option selected>Any</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                            </select>
                        </div>
                        <div class="field-label">
                            <label class="search-label" for="room">Room</label>
                            <input type="number" placeholder="301.1" name="room" id="room" class="search-field"/>
                        </div>
                    </div>
                    <div class="field-label">
                        <label class="search-label" for="department">Department</label>
                        <select id="department" name="department" class="search-field">
                            <option selected>Any</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                        </select>
                    </div>
                    <button class="search-button">SEARCH</button>
                </form>
            </div>

            <!-- List view of employees -->
            <div class="content-container">
                <p class="employees-amount-large"></p>   
                <div id="icon-tabs">
                    <div class="icon-switcher-container icon-grid">
                        <img src="./images/grid-view.png" alt="Gird view" width="24px" height="24px"/>
                    </div>
                    <div class="icon-switcher-container icon-list">
                        <img src="./images/list-view.png" alt="List view" width="24px" height="24px" />
                    </div>
                </div>
                <ul class="employees-list-grid-view active-content"></ul>
                <div class="listing-view-container">
                    <div id="listing-view-banner">
                        <div class="banner-part first-part">
                            <div>
                                <img src="./images/employee.png" alt="Photo" width="10px" height="10px" />
                                <span>Photo</span>
                            </div>
                            <div>
                                <img src="./images/user.png" alt="Name" width="10px" height="10px" />
                                <span>Name</span>
                            </div>
                        </div>
                        <div class="banner-part second-part">
                            <div style="display: flex; align-items: center;">
                                <span class="material-symbols-outlined" style="font-size: 1.8rem;">
                                    business_center
                                </span>
                                <span>Department</span>
                            </div>
                            <div>
                                <img src="./images/mobile-phone.png" alt="Room" width="10px" height="10px" />
                                <span>Room</span>
                            </div>
                        </div>
                    </div> 
                    <ul id="employees-list-listing-view"></ul>
                </div>   
            </div>
        </div>

        <!-- List view for mobile/tablet screens -->
        <p id="employees-amount"></p>
        <ul id="employees-list"></ul>
    </main>

    <!-- Not Found page -->
    <div id="empty-page">
        <img src="./images/nothing-found.png" alt="Nothing" width="300px" height="300px">
        <h3 id="empty-result-title">404 Page not found</h3>
        <p id="empty-result-desc">Sorry, we can't find that page! It might be an old link or maybe it was moved.</p>
        <button id="home-page-button">GO TO THE HOME PAGE</button>
    </div>   
</body>
</html>
